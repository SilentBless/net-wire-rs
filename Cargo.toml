[package]
name = "net-wire"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Allocation-free no_std wire views and codecs for network protocols."
documentation = "https://docs.rs/net-wire"
homepage = "https://github.com/SilentBless/net-wire-rs"
repository = "https://github.com/SilentBless/net-wire-rs"
readme = "README.md"
license = "MIT"
keywords = ["network", "protocol", "no-std", "zero-copy", "wire"]
categories = ["network-programming", "no-std", "parser-implementations", "encoding"]
autotests = false

[lib]
name = "net_wire"

[features]
default = []
ethernet = ["dep:wire-repr"]
arp = ["dep:wire-repr"]
ipv4 = ["dep:wire-repr"]
ipv6 = []
icmpv4 = []
icmpv6 = []
kcp = []
udp = []
tcp = []
tls = []
http1 = []
http2 = []
quic = []
qpack = []
http3 = ["quic", "qpack"]

[dependencies]
wire-repr = { version = "0.3.0", default-features = false, optional = true }

[dev-dependencies]
socket2 = { version = "0.6.5", features = ["all"] }

[[example]]
name = "packet-inspector"
path = "examples/packet-inspector/main.rs"
required-features = ["ethernet", "ipv4", "ipv6", "udp", "tcp"]

[[example]]
name = "dns-query"
path = "examples/dns-query/main.rs"
required-features = ["ipv4", "udp"]

[[example]]
name = "tls-client-hello"
path = "examples/tls-client-hello/main.rs"
required-features = ["tls"]

[[test]]
name = "ethernet"
path = "tests/ethernet/main.rs"
required-features = ["ethernet"]

[[test]]
name = "arp"
path = "tests/arp/main.rs"
required-features = ["arp"]

[[test]]
name = "ipv4"
path = "tests/ipv4/main.rs"
required-features = ["ipv4"]

[[test]]
name = "ipv6"
path = "tests/ipv6/main.rs"
required-features = ["ipv6"]

[[test]]
name = "icmpv4"
path = "tests/icmpv4/main.rs"
required-features = ["icmpv4"]

[[test]]
name = "icmpv6"
path = "tests/icmpv6/main.rs"
required-features = ["icmpv6"]

[[test]]
name = "udp"
path = "tests/udp/main.rs"
required-features = ["udp"]

[[test]]
name = "kcp"
path = "tests/kcp/main.rs"
required-features = ["kcp"]

[[test]]
name = "tcp"
path = "tests/tcp/main.rs"
required-features = ["tcp"]

[[test]]
name = "tls"
path = "tests/tls/main.rs"
required-features = ["tls"]

[[test]]
name = "http1"
path = "tests/http1/main.rs"
required-features = ["http1"]

[[test]]
name = "http2"
path = "tests/http2/main.rs"
required-features = ["http2"]

[[test]]
name = "quic"
path = "tests/quic/main.rs"
required-features = ["quic"]

[[test]]
name = "quic_tls"
path = "tests/quic/integrations/tls.rs"
required-features = ["quic", "tls"]

[[test]]
name = "qpack"
path = "tests/qpack/main.rs"
required-features = ["qpack"]

[[test]]
name = "http3"
path = "tests/http3/main.rs"
required-features = ["http3"]

[lints.rust]
unsafe_code = "deny"

[package.metadata.docs.rs]
all-features = true
